name: Update screenshot baselines

# Regenerates the Linux visual baselines (tests/__screenshots__/**/*-linux.png) and
# commits them to the branch this is run on, so the change shows up as an image diff
# in the pull request for review. Refuses to run on main. See TESTING.md §4.5.
#
# Commits made with GITHUB_TOKEN don't trigger other workflows: re-run the PR checks
# (or push another commit) afterwards.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run on main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "::error::Run this on a feature branch, then merge via pull request."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/visual.spec.ts --update-snapshots=all
        env:
          PYTHON: python
      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/__screenshots__/
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "Update visual baselines (Linux)"
            git push
          fi
