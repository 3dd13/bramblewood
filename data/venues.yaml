# Where matches are played.
#
# home:  Bramblewood's own venue (used for every H match).
# clubs: opponent venues (used for A matches). The key is the club name as
#        written in fixtures.yaml without its team letter, so "Felbridge A"
#        and "Felbridge B" both use the "Felbridge" entry.
#        Leave `address` blank if unknown; the site just won't show a map link.
#        If a club plays at a different venue in one league, add it under
#        `leagues:` using the league name from teams.yaml, e.g.
#          Example Club:
#            name: Example Club Hall
#            address: ...
#            leagues:
#              Crawley League:
#                name: Example Leisure Centre
#                address: ...

home:
  name: Brambletye School
  address: Lewes Rd, East Grinstead RH19 3PD

clubs:
  # Sources (checked 2026-09-25): venue names from the 2026/27 localleagues.uk
  # fixture pages (Crawley, West Weald), the Mid Sussex association's club list
  # and the Tunbridge Wells league venue list for 2025/26; addresses from each
  # venue's own site or the government schools register.
  AIT:
    name: Mascalls Academy
    address: Maidstone Road, Paddock Wood, Tonbridge TN12 6LT
  Angel:
