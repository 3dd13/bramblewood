    address: Lewes Road, Brighton BN1 9PW
  Brighton:
    name: University of Sussex Sport Centre
    address: Falmer, Brighton BN1 9RB
  BSMS:
    name: University of Sussex Sport Centre
    address: Falmer, Brighton BN1 9RB
  Chanctonbury:
