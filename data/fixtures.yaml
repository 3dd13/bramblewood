# Bramblewood match fixtures
#
# One entry per match. After you commit a change, the site checks this file
# and redeploys. See EDITING.md for the full guide.
#
#   date:      YYYY-MM-DD
#   team:      a team code from data/teams.yaml (e.g. "CR Mens")
#   home_away: H or A
#   opponent:  opponent club, optionally with its team letter ("Felbridge B").
#              The club name (without the letter) must be listed in data/venues.yaml.
#   time:      "HH:MM", 24-hour (e.g. "19:30"). Optional; leave it out if unknown.
#   notes:     optional free text shown on the site (e.g. "Postponed from 9 Oct")
#   address:   optional; overrides the venue address for this one match
#
# Keep entries in date order; the site sorts them anyway.

